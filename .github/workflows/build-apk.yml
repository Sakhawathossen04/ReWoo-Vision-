name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download repository source
      - name: Checkout source
        uses: actions/checkout@v5

      # 2. Java required by Android/Gradle
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android command-line tools + sdkmanager + required NDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;27.0.12077973'

      # 4. Install the Flutter version used by this project
      - name: Set up Flutter 3.32.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true

      # 5. Verify cloud build environment
      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version
          sdkmanager --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      # 6. Verify exact NDK is installed
      - name: Verify Android NDK
        run: |
          echo "Installed NDK versions:"
          ls -la "$ANDROID_SDK_ROOT/ndk"
          test -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973"

      # 7. Download Flutter/Dart dependencies
      - name: Get Flutter packages
        run: flutter pub get

      # 8. Static analysis
      # Does not stop APK build for warnings/static-analysis issues.
      # Actual compile errors will still fail at the APK build step.
      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 9. Run tests
      # Does not block APK generation if a non-build-critical test fails.
      - name: Run tests
        continue-on-error: true
        run: flutter test

      # 10. Build Android release APK
      - name: Build release APK
        run: flutter build apk --release

      # 11. Verify APK exists
      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      # 12. Upload APK so it can be downloaded from GitHub Actions
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemma-vision-bangla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
